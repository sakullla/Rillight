name: rillight
description: "灯川 Rillight Emby client for desktop and Android"
publish_to: 'none'
version: 0.1.27+28

environment:
  sdk: ^3.11.5

dependencies:
  animations: ^2.1.1
  cryptography: ^2.9.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.4
  win32: ^6.0.1
  go_router: ^16.2.0
  intl: any
  rillight_player:
    path: packages/rillight_player
  path_provider: ^2.1.6
  screen_retriever: ^0.2.0
  window_manager: ^0.5.2
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0
  wakelock_plus: ^1.8.0

# 2.3+ depends on package:jni, an FFI plugin for Linux/Windows that links
# libjvm.so whenever a JDK is present (GitHub-hosted runners). This app is
# built for desktop and Android and must not ship a JVM helper in the Linux bundle.
dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
