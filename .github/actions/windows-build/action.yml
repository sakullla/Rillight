name: Verified Windows release build
description: Warm default-branch dependency caches and build the candidate with release audits
runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.6'
        channel: stable
        cache: true

    - name: Set up native build tools
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          git make diffutils
          mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja mingw-w64-x86_64-meson
          mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-fontconfig mingw-w64-x86_64-freetype
          mingw-w64-x86_64-fribidi mingw-w64-x86_64-harfbuzz

    - name: Identify native toolchain for the SDK cache
      id: toolchain
      shell: msys2 {0}
      run: echo "packages=$(pacman -Q | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Restore Windows media SDK
      id: sdk-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/rillight-windows-sdk
        key: windows-media-sdk-${{ runner.arch }}-${{ steps.toolchain.outputs.packages }}-${{ hashFiles('packages/rillight_player/native/*core_dependencies*', 'packages/rillight_player/native/build_windows_dependencies.py', 'packages/rillight_player/native/build_subtitle_unicode.py', 'packages/rillight_player/native/patches/**') }}

    - name: Build Windows SDK and candidate core
      shell: pwsh
      env:
        MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        $prefix = Join-Path $env:RUNNER_TEMP 'rillight-windows-sdk'
        $work = Join-Path $env:RUNNER_TEMP 'rillight-windows-sdk-work'
        python packages/rillight_player/native/build_windows_dependencies.py `
          --prefix "$prefix" --work "$work" --msys-root "$env:MSYS_ROOT"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "RILLIGHT_CORE_PREFIX_WINDOWS_X64=$prefix" >> $env:GITHUB_ENV

    - name: Save verified Windows SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/rillight-windows-sdk
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

    - name: Install dependencies
      shell: pwsh
      run: flutter pub get

    - name: Build Windows
      shell: pwsh
      run: flutter build windows --release --no-pub

    - name: Audit Windows release bundle
      shell: pwsh
      run: python tool/verify_player_dependencies.py
