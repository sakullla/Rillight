name: Verified Windows release build
description: Warm default-branch dependency caches and build the candidate with release audits
inputs:
  hills-key:
    description: Hex AES-256 key for Hills backup imports (64 hex chars, from secrets)
    required: false
    default: ''
  common-key:
    description: Hex AES-256 key for RodelPlayer common-config imports (64 hex chars, from secrets)
    required: false
    default: ''
  rpb-key:
    description: Hex AES-128 key for .rpb config imports (32 hex chars, from secrets)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Validate backup import key inputs
      # PR/main validation runs without secrets, including fork PRs.
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        HILLS_KEY: ${{ inputs.hills-key }}
        COMMON_KEY: ${{ inputs.common-key }}
        RPB_KEY: ${{ inputs.rpb-key }}
      run: |
        set -euo pipefail
        check() {
          local name="$1" value="$2" length="$3"
          if [ -z "$value" ]; then
            echo "::error::$name was not provided; release builds must carry backup import keys."
            return 1
          fi
          if [[ ! "$value" =~ ^[0-9a-fA-F]+$ ]] || [ "${#value}" -ne "$length" ]; then
            echo "::error::$name must be exactly $length hex characters."
            return 1
          fi
        }
        check RILLIGHT_HILLS_KEY "$HILLS_KEY" 64
        check RILLIGHT_COMMON_KEY "$COMMON_KEY" 64
        check RILLIGHT_RPB_KEY "$RPB_KEY" 32
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: stable
        cache: true

    - name: Set up native build tools
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        install: >-
          git make diffutils
          mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson
          mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-fontconfig mingw-w64-ucrt-x86_64-freetype
          mingw-w64-ucrt-x86_64-fribidi mingw-w64-ucrt-x86_64-harfbuzz mingw-w64-ucrt-x86_64-zlib

    - name: Identify native toolchain for the SDK cache
      id: toolchain
      shell: msys2 {0}
      run: echo "packages=$(pacman -Q | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Restore Windows media SDK
      id: sdk-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/rillight-windows-ucrt64-sdk
        key: windows-media-sdk-ucrt64-${{ runner.arch }}-${{ steps.toolchain.outputs.packages }}-${{ hashFiles('packages/rillight_player/native/*core_dependencies*', 'packages/rillight_player/native/build_windows_dependencies.py', 'packages/rillight_player/native/build_subtitle_unicode.py', 'packages/rillight_player/native/patches/**') }}

    - name: Build Windows SDK and candidate core
      shell: pwsh
      env:
        MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        $prefix = Join-Path $env:RUNNER_TEMP 'rillight-windows-ucrt64-sdk'
        $work = Join-Path $env:RUNNER_TEMP 'rillight-windows-ucrt64-sdk-work'
        python packages/rillight_player/native/build_windows_dependencies.py `
          --prefix "$prefix" --work "$work" --msys-root "$env:MSYS_ROOT"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "RILLIGHT_CORE_PREFIX_WINDOWS_X64=$prefix" >> $env:GITHUB_ENV

    - name: Save verified Windows SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/rillight-windows-ucrt64-sdk
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

    - name: Install dependencies
      shell: pwsh
      run: flutter pub get

    - name: Build Windows
      shell: bash
      env:
        HILLS_KEY: ${{ inputs.hills-key }}
        COMMON_KEY: ${{ inputs.common-key }}
        RPB_KEY: ${{ inputs.rpb-key }}
      run: >-
        flutter build windows --release --no-pub
        --dart-define=RILLIGHT_HILLS_KEY="$HILLS_KEY"
        --dart-define=RILLIGHT_COMMON_KEY="$COMMON_KEY"
        --dart-define=RILLIGHT_RPB_KEY="$RPB_KEY"

    - name: Audit Windows release bundle
      shell: pwsh
      run: python tool/verify_player_dependencies.py
