name: Verified Android core SDK
description: Cache and verify the pinned FFmpeg/libass SDK for all three ABIs
runs:
  using: composite
  steps:
    - name: Install pinned Android build tools
      shell: bash
      run: |
        set -euo pipefail
        set +o pipefail
        yes | sdkmanager --licenses > /dev/null
        set -o pipefail
        sdkmanager --install 'ndk;28.2.13676358' 'build-tools;36.0.0'
    - name: Restore pinned Android SDK
      id: sdk-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/rillight-android-sdk
        key: android-ubuntu22-${{ runner.arch }}-ndk28.2.13676358-${{ hashFiles('.github/actions/android-core/action.yml', 'packages/rillight_player/native/*core_dependencies*', 'packages/rillight_player/native/build_android_libass.py', 'packages/rillight_player/native/patches/**') }}
    - name: Build pinned FFmpeg and libass for all Android ABIs
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config
        python3 -m pip install meson==1.9.1 ninja==1.13.0
        prefix="$RUNNER_TEMP/rillight-android-sdk"
        work="$RUNNER_TEMP/rillight-android-sdk-work"
        ndk="$ANDROID_HOME/ndk/28.2.13676358"
        python3 packages/rillight_player/native/build_android_core_dependencies.py \
          --prefix-root "$prefix" --work "$work" --ndk "$ndk"
        python3 packages/rillight_player/native/build_android_libass.py \
          --prefix-root "$prefix" --work "$work" --ndk "$ndk"
    - name: Verify all ABI manifests and library hashes, including cache hits
      shell: bash
      run: |
        set -euo pipefail
        prefix="$RUNNER_TEMP/rillight-android-sdk"
        for abi in arm64-v8a armeabi-v7a x86_64; do
          python3 packages/rillight_player/native/verify_core_dependencies.py \
            --prefix "$prefix/$abi" --target "android-$abi" --require-subtitles
        done
        echo "RILLIGHT_CORE_SDK_ROOT=$prefix" >> "$GITHUB_ENV"
    - name: Save verified Android SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/rillight-android-sdk
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
