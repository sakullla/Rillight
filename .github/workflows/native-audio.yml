name: Native audio contracts

on:
  push:
    paths:
      - 'packages/rillight_player/macos/**'
      - 'packages/rillight_player/linux/**'
      - 'packages/rillight_player/windows/**'
      - 'packages/rillight_player/native/**'
      - '.github/workflows/native-audio.yml'
  pull_request:
    paths:
      - 'packages/rillight_player/macos/**'
      - 'packages/rillight_player/linux/**'
      - 'packages/rillight_player/windows/**'
      - 'packages/rillight_player/native/**'
      - '.github/workflows/native-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile Core Audio output and test transport contracts
        run: |
          cmake -S packages/rillight_player/native/core_tests/macos -B build/audio-contracts
          cmake --build build/audio-contracts --parallel 3
          ctest --test-dir build/audio-contracts --output-on-failure
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PulseAudio development dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libpulse-dev pulseaudio
      - name: Test route fallback and virtual PulseAudio output
        run: |
          pulseaudio --start --exit-idle-time=-1 --load='module-null-sink sink_name=rillight_validation'
          cmake -S packages/rillight_player/native/core_tests/linux -B build/audio-contracts -DRILLIGHT_PULSE_TEST=ON
          cmake --build build/audio-contracts --parallel 3
          ctest --test-dir build/audio-contracts --output-on-failure

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile WASAPI output and test route recovery contracts
        shell: pwsh
        run: |
          cmake -S packages/rillight_player/native/core_tests/windows -B build/windows-audio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-audio --config Release --parallel 3 --target rillight_windows_audio_output_compile rillight_windows_audio_route_test rillight_windows_audio_route_recovery_test rillight_windows_audio_schedule_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/windows-audio -C Release --output-on-failure -R 'rillight_windows_audio_(route|route_recovery|schedule)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
