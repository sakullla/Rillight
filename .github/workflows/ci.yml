name: Pull request validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter format, analysis, and tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages/rillight_player/lib packages/rillight_player/test integration_test/android_app_probe.dart integration_test/android_player_smoke.dart

      - name: Check test collection
        run: python3 tool/test_execution/generate_suites.py --check

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Native package and Linux installer contracts
        run: |
          flutter test packages/rillight_player/test
          python3 tool/player_core_release_checks_test.py
          python3 tool/player_performance_checks_test.py
          python3 tool/linux_release_checks_test.py
          python3 macos/verify_bundle_test.py
          bash linux/packaging/launcher_contract_test.sh

  linux-package:
    uses: ./.github/workflows/linux-package.yml

  macos-package:
    if: ${{ vars.MACOS_CORE_SDK_URL != '' && vars.MACOS_CORE_SDK_SHA256 != '' && vars.MACOS_CORE_DYLIB_URL != '' && vars.MACOS_CORE_DYLIB_SHA256 != '' }}
    uses: ./.github/workflows/macos-package.yml
    with:
      core_sdk_url: ${{ vars.MACOS_CORE_SDK_URL }}
      core_sdk_sha256: ${{ vars.MACOS_CORE_SDK_SHA256 }}
      core_dylib_url: ${{ vars.MACOS_CORE_DYLIB_URL }}
      core_dylib_sha256: ${{ vars.MACOS_CORE_DYLIB_SHA256 }}

  macos-handoff:
    if: ${{ vars.MACOS_CORE_SDK_URL == '' || vars.MACOS_CORE_SDK_SHA256 == '' || vars.MACOS_CORE_DYLIB_URL == '' || vars.MACOS_CORE_DYLIB_SHA256 == '' }}
    name: 'macOS candidate unverified: target-machine handoff'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Record missing macOS SDK/core evidence
        run: |
          test -s packages/rillight_player/macos/TESTING_HANDOFF.md
          echo 'macOS package, playback and hardware checks were not run: pinned universal SDK/core inputs are unavailable.' >> "$GITHUB_STEP_SUMMARY"
          cat packages/rillight_player/macos/TESTING_HANDOFF.md >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android APK and native contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The deprecated tools package is no longer published, so the action default fails.
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build pinned FFmpeg and libass for all Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install 'ndk;28.2.13676358' 'build-tools;36.0.0'
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
          python3 -m pip install meson==1.9.1 ninja==1.13.0
          prefix="$RUNNER_TEMP/rillight-android-sdk"
          work="$RUNNER_TEMP/rillight-android-sdk-work"
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          python3 packages/rillight_player/native/build_android_core_dependencies.py \
            --prefix-root "$prefix" --work "$work" --ndk "$ndk"
          python3 packages/rillight_player/native/build_android_libass.py \
            --prefix-root "$prefix" --work "$work" --ndk "$ndk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            python3 packages/rillight_player/native/verify_core_dependencies.py \
              --prefix "$prefix/$abi" --target "android-$abi" --require-subtitles
          done
          echo "RILLIGHT_CORE_SDK_ROOT=$prefix" >> "$GITHUB_ENV"
      - name: Build ordinary application
        run: flutter build apk --debug
      - name: Native plugin tests
        working-directory: android
        run: ./gradlew :rillight_player:testDebugUnitTest
      - name: Host verifier regression and APK contract
        run: |
          python3 -m pip install Pillow==12.1.1
          python3 tool/android_release_checks_test.py
          python3 tool/android_release_checks.py --apk build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: rillight-android-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/android-validation/runs/**/result.json
          if-no-files-found: error
