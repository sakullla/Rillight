name: Pull request validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter format, analysis, and tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages/rillight_player/lib packages/rillight_player/test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Native package and Linux installer contracts
        run: |
          flutter test packages/rillight_player/test
          python3 tool/linux_release_checks_test.py
          python3 macos/verify_bundle_test.py
          bash linux/packaging/launcher_contract_test.sh

  linux-package:
    uses: ./.github/workflows/linux-package.yml

  macos-package:
    uses: ./.github/workflows/macos-package.yml
