name: Linux package and installed desktop regression

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: v0.0.0-ci

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev dpkg-dev patchelf nasm python3-venv \
            libass-dev libgnutls28-dev libaom-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev \
            libfreetype-dev libfontconfig1-dev libfribidi-dev libharfbuzz-dev \
            libasound2-dev libpulse-dev libva-dev libdrm-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxpresent-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libepoxy-dev ffmpeg
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/rillight-native
          key: owned-core-ubuntu22-${{ hashFiles('packages/rillight_player/native/build_linux.sh', 'packages/rillight_player/native/build_core_dependencies.py', 'packages/rillight_player/native/verify_core_dependencies.py') }}
      - name: Build the fixed media stack
        run: bash packages/rillight_player/native/build_linux.sh "$RUNNER_TEMP/rillight-native"
      - name: Build and audit the complete Flutter bundle
        run: |
          export RILLIGHT_CORE_PREFIX="$RUNNER_TEMP/rillight-native"
          python3 packages/rillight_player/native/verify_core_dependencies.py \
            --prefix "$RILLIGHT_CORE_PREFIX" --target linux-x64 --require-subtitles
          export PKG_CONFIG_PATH="$RILLIGHT_CORE_PREFIX/lib/pkgconfig"
          # Link-time discovery only; bundle audit explicitly removes this.
          export LD_LIBRARY_PATH="$RILLIGHT_CORE_PREFIX/lib"
          flutter pub get
          flutter build linux --release
          python3 tool/linux_release_checks.py verify build/linux/x64/release/bundle
      - name: Package real system dependencies
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          python3 tool/linux_release_checks.py deb build/linux/x64/release/bundle \
            "${BUILD_VERSION#v}" "dist/linux/Rillight-linux-x64-${BUILD_VERSION}.deb"
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: dist/linux/*.deb
          if-no-files-found: error
      - name: Build the production-entry playback validation target
        run: |
          export RILLIGHT_CORE_PREFIX="$RUNNER_TEMP/rillight-native"
          export PKG_CONFIG_PATH="$RILLIGHT_CORE_PREFIX/lib/pkgconfig"
          export LD_LIBRARY_PATH="$RILLIGHT_CORE_PREFIX/lib"
          flutter build linux --release --target tool/player_smoke.dart
          tar -C build/linux/x64/release/bundle -czf linux-playback-bundle.tar.gz .
      - name: Generate deterministic media fixtures
        run: |
          python3 tool/player_fixtures.py --media build/player-validation/media --ffmpeg ffmpeg
          tar -C build/player-validation/media -czf linux-playback-media.tar.gz .
      - uses: actions/upload-artifact@v6
        with:
          name: linux-playback-inputs
          path: |
            linux-playback-bundle.tar.gz
            linux-playback-media.tar.gz
          if-no-files-found: error

  ubuntu24-install:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-linux
          path: /tmp/rillight-package
      - uses: actions/download-artifact@v7
        with:
          name: linux-playback-inputs
          path: /tmp/rillight-playback-inputs
      - name: Install into a clean Ubuntu 24.04 userspace
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y /tmp/rillight-package/*.deb dbus-x11 xvfb xdotool \
            openbox libgtk-3-bin desktop-file-utils python3 python3-pyatspi \
            python3-pil x11-apps pulseaudio pulseaudio-utils
          python3 tool/linux_release_checks.py verify /opt/rillight \
            --desktop /usr/share/applications/rillight.desktop
          desktop-file-validate /usr/share/applications/rillight.desktop
      - name: Exercise actual desktop entry and missing-library UI
        run: xvfb-run -a dbus-run-session -- bash linux/packaging/desktop_smoke.sh
      - name: Verify native video pixels and virtual audio in actual child windows
        run: |
          mkdir -p /tmp/rillight-playback-bundle /tmp/rillight-playback-media
          tar -C /tmp/rillight-playback-bundle -xzf /tmp/rillight-playback-inputs/linux-playback-bundle.tar.gz
          tar -C /tmp/rillight-playback-media -xzf /tmp/rillight-playback-inputs/linux-playback-media.tar.gz
          xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- \
            bash linux/packaging/playback_smoke.sh /tmp/rillight-playback-bundle \
            /tmp/rillight-playback-media /tmp/rillight-playback-evidence
      - name: Preserve desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-installed-desktop-diagnostics
          path: |
            /tmp/rillight-desktop-smoke
            /tmp/rillight-playback-evidence
          if-no-files-found: ignore
