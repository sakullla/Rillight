name: macOS native build and package checks

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: v0.0.0-ci
      signing:
        type: string
        default: adhoc
      core_sdk_url:
        type: string
        default: ''
      core_sdk_sha256:
        type: string
        default: ''
      core_dylib_url:
        type: string
        default: ''
      core_dylib_sha256:
        type: string
        default: ''
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Flutter and native dependencies
        run: flutter pub get
      - name: Provision pinned macOS core SDK and dylib
        shell: bash
        env:
          CORE_SDK_URL: ${{ inputs.core_sdk_url }}
          CORE_SDK_SHA256: ${{ inputs.core_sdk_sha256 }}
          CORE_DYLIB_URL: ${{ inputs.core_dylib_url }}
          CORE_DYLIB_SHA256: ${{ inputs.core_dylib_sha256 }}
        run: |
          set -euo pipefail
          for name in CORE_SDK_URL CORE_SDK_SHA256 CORE_DYLIB_URL CORE_DYLIB_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing pinned macOS core input ${name}; see packages/rillight_player/macos/TESTING_HANDOFF.md"
              exit 1
            fi
          done
          sdk_archive="$RUNNER_TEMP/rillight-macos-sdk.tar.gz"
          core_dylib="$RUNNER_TEMP/librillight_core.dylib"
          sdk_prefix="$RUNNER_TEMP/rillight-macos-sdk"
          curl --fail --location --retry 3 "$CORE_SDK_URL" --output "$sdk_archive"
          curl --fail --location --retry 3 "$CORE_DYLIB_URL" --output "$core_dylib"
          echo "$CORE_SDK_SHA256  $sdk_archive" | shasum -a 256 --check
          echo "$CORE_DYLIB_SHA256  $core_dylib" | shasum -a 256 --check
          mkdir -p "$sdk_prefix"
          tar -xzf "$sdk_archive" -C "$sdk_prefix"
          python3 packages/rillight_player/native/verify_core_dependencies.py \
            --prefix "$sdk_prefix" --target macos-universal --require-subtitles
          echo "RILLIGHT_MACOS_CORE_PREFIX=$sdk_prefix" >> "$GITHUB_ENV"
          echo "RILLIGHT_MACOS_CORE_DYLIB=$core_dylib" >> "$GITHUB_ENV"
          echo "RILLIGHT_MACOS_CORE_SHA256=$CORE_DYLIB_SHA256" >> "$GITHUB_ENV"
      - name: Install DMG layout dependency
        run: python3 -m pip install ds_store==1.3.1
      - name: Verify signing and Mach-O audit regressions
        run: python3 macos/verify_bundle_test.py
      - name: Verify drag-install DMG layout regressions
        run: python3 macos/package_dmg_test.py
      - name: Compile the Release sandbox proxy test target
        run: flutter build macos --release --target integration_test/macos_proxy_smoke.dart
      - name: Exercise production loopback proxy and missing-server negative control
        run: |
          python3 macos/proxy_smoke.py build/macos/Build/Products/Release/rillight.app \
            build/macos-proxy-sandbox-evidence
      - name: Restore the ordinary release entry point
        run: flutter build macos --release --target lib/main.dart
      - name: Verify bundled dylib closure and runtime versions
        shell: bash
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/rillight.app"
          python3 macos/verify_bundle.py "$app"
          # Probe packaged core/FFmpeg versions; this is not a GUI/playback test.
          DYLD_LIBRARY_PATH="$PWD/$app/Contents/Frameworks" \
            python3 macos/probe_core.py "$app" > macos-native-versions.json
      - name: Check macOS signing secrets
        if: inputs.signing == 'identity'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${MACOS_CERTIFICATE_P12_BASE64:-}" ] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [ -n "${MACOS_CERTIFICATE_PASSWORD:-}" ] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing macOS signing secrets: ${missing[*]}. Configure them in repository Settings > Secrets and variables > Actions before tagging a release."
            exit 1
          fi

      - name: Import the self-signed certificate into a temporary keychain
        if: inputs.signing == 'identity'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/rillight-certificate.p12"
          keychain="$RUNNER_TEMP/rillight-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/rillight-certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" \
            "$(security list-keychain -d user | tr '\n' ' ')"

      - name: Sign, verify and package
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
          SIGNING_MODE: ${{ inputs.signing }}
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/rillight.app"
          if [ "$SIGNING_MODE" != "identity" ] && [ "$SIGNING_MODE" != "adhoc" ]; then
            echo "::error::Unsupported macOS signing mode: $SIGNING_MODE"
            exit 1
          fi
          if [ "$SIGNING_MODE" = "identity" ]; then
            suffix="signed"
            python3 macos/sign_bundle.py "$app" --identity 'Rillight Self Sign'
          else
            suffix="adhoc"
            python3 macos/sign_bundle.py "$app"
          fi
          python3 macos/verify_bundle.py --signed "$app"
          codesign --display --entitlements :- "$app" > macos-release-entitlements.plist
          python3 macos/package_dmg.py "$app" \
            "Rillight-macos-${BUILD_VERSION}-$(uname -m)-${suffix}.dmg"

      - name: Delete the temporary signing keychain
        if: ${{ always() && inputs.signing == 'identity' }}
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/rillight-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: Rillight-macos-*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-native-versions
          path: |
            macos-native-versions.json
            macos-release-entitlements.plist
            build/macos-proxy-sandbox-evidence
          if-no-files-found: warn
