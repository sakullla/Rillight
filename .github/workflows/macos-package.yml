name: macOS native build and package checks

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: v0.0.0-ci
      signing:
        type: string
        default: adhoc
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Identify Xcode toolchain for the SDK cache
        id: core-inputs
        shell: bash
        run: |
          toolchain="$(xcodebuild -version | shasum -a 256 | awk '{print $1}')"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - name: Check macOS signing secrets
        if: inputs.signing == 'identity'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${MACOS_CERTIFICATE_P12_BASE64:-}" ] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [ -n "${MACOS_CERTIFICATE_PASSWORD:-}" ] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing macOS signing secrets: ${missing[*]}. Configure them in repository Settings > Secrets and variables > Actions before tagging a release."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install Flutter and native dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install nasm pkg-config ffmpeg
          flutter pub get
      - name: Restore pinned universal SDK
        id: sdk-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/rillight-macos-sdk
          key: macos15-universal-${{ runner.arch }}-${{ steps.core-inputs.outputs.toolchain }}-${{ hashFiles('.github/scripts/macos_core.sh', 'packages/rillight_player/native/build_macos.sh', 'packages/rillight_player/native/*core_dependencies*', 'packages/rillight_player/native/prepare_macos.py', 'packages/rillight_player/native/patches/**') }}
      - name: Provision pinned macOS core SDK and dylib
        shell: bash
        run: bash .github/scripts/macos_core.sh
      - name: Save verified universal SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/rillight-macos-sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Verify native frame output logic
        run: |
          cmake -S packages/rillight_player/native/core_tests/macos -B build/macos-frame-output
          cmake --build build/macos-frame-output
          ctest --test-dir build/macos-frame-output --output-on-failure
      - name: Install DMG layout dependency
        run: python3 -m pip install ds_store==1.3.1
      - name: Verify signing and Mach-O audit regressions
        run: |
          python3 macos/verify_bundle_test.py
          # Xcode build phases can resolve Apple's Python instead of setup-python.
          /usr/bin/python3 macos/verify_bundle_test.py
      - name: Verify drag-install DMG layout regressions
        run: python3 macos/package_dmg_test.py
      - name: Compile the Release sandbox proxy test target
        run: flutter build macos --release --no-pub --target integration_test/macos_proxy_smoke.dart
      - name: Exercise production loopback proxy and missing-server negative control
        id: proxy
        run: |
          python3 macos/proxy_smoke.py build/macos/Build/Products/Release/Rillight.app \
            build/macos-proxy-sandbox-evidence
      - name: Exercise production playback controls on the hosted runner
        id: playback
        run: python3 macos/player_smoke.py --skip-restore --skip-window-capture
      - name: Restore the ordinary release entry point
        run: flutter build macos --release --no-pub --target lib/main.dart
      - name: Verify bundled dylib closure and runtime versions
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/Rillight.app"
          python3 macos/verify_bundle.py "$app"
          # Probe packaged core/FFmpeg versions; this is not a GUI/playback test.
          DYLD_LIBRARY_PATH="$PWD/$app/Contents/Frameworks" \
            python3 macos/probe_core.py "$app" > macos-native-versions.json
      - name: Import the self-signed certificate into a temporary keychain
        if: inputs.signing == 'identity'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/rillight-certificate.p12"
          keychain="$RUNNER_TEMP/rillight-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/rillight-certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" \
            "$(security list-keychain -d user | tr '\n' ' ')"

      - name: Sign, verify and package
        id: package
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
          SIGNING_MODE: ${{ inputs.signing }}
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/Rillight.app"
          if [ "$SIGNING_MODE" != "identity" ] && [ "$SIGNING_MODE" != "adhoc" ]; then
            echo "::error::Unsupported macOS signing mode: $SIGNING_MODE"
            exit 1
          fi
          if [ "$SIGNING_MODE" = "identity" ]; then
            suffix="signed"
            python3 macos/sign_bundle.py "$app" --identity 'Rillight Self Sign'
          else
            suffix="adhoc"
            python3 macos/sign_bundle.py "$app"
          fi
          python3 macos/verify_bundle.py --signed "$app"
          codesign --display --entitlements :- "$app" > macos-release-entitlements.plist
          python3 macos/package_dmg.py "$app" \
            "Rillight-macos-${BUILD_VERSION}-$(uname -m)-${suffix}.dmg"

      - name: Delete the temporary signing keychain
        if: ${{ always() && inputs.signing == 'identity' }}
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/rillight-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: release-macos
          compression-level: 0
          path: Rillight-macos-*.dmg
          if-no-files-found: error
      - name: Preserve native inputs and source build provenance
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-native-inputs
          path: build/macos-native-inputs
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-native-versions
          path: |
            macos-native-versions.json
            macos-release-entitlements.plist
            build/macos-proxy-sandbox-evidence
            build/player-validation/macos-runs
            build/macos-frame-output/Testing/Temporary
          if-no-files-found: warn
      - name: Report macOS validation scope
        if: always()
        env:
          BUNDLE_RESULT: ${{ steps.bundle.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          PROXY_RESULT: ${{ steps.proxy.outcome }}
          PLAYBACK_RESULT: ${{ steps.playback.outcome }}
        run: |
          {
            echo '## macOS hosted-runner validation'
            echo 'Native inputs: pinned source build with a verified SDK cache'
            echo "Bundle audit and loaded libraries: $BUNDLE_RESULT"
            echo "Signing and DMG packaging: $PACKAGE_RESULT"
            echo "Sandbox proxy: $PROXY_RESULT"
            echo "Playback controls and decoder diagnostics: $PLAYBACK_RESULT"
            echo 'Screen capture was disabled on the hosted runner. Changing GUI frames, physical audio, Intel device playback and hardware performance remain unverified.'
            echo 'See packages/rillight_player/macos/TESTING_HANDOFF.md for target-device checks. CI success is not release hardware acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
