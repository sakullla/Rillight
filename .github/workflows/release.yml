name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and audit Windows
        uses: ./.github/actions/windows-build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $output = Join-Path $env:GITHUB_WORKSPACE "dist\windows"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$version" "/O$output" "windows\installer\rillight.iss"

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          compression-level: 0
          path: dist/windows/Rillight-windows-x64-${{ github.ref_name }}-setup.exe
          if-no-files-found: error

  macos:
    uses: ./.github/workflows/macos-package.yml
    with:
      version: ${{ github.ref_name }}
      signing: identity
    secrets: inherit

  linux:
    uses: ./.github/workflows/linux-package.yml
    with:
      version: ${{ github.ref_name }}

  android:
    name: Build Android
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            packages/rillight_player/android/**/*.gradle*
            pubspec.lock

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Check Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "${ANDROID_STORE_PASSWORD:-}" ] || missing+=(ANDROID_STORE_PASSWORD)
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Android signing secrets: ${missing[*]}. Configure them in repository Settings > Secrets and variables > Actions before tagging a release."
            exit 1
          fi

      - name: Decode keystore and write key.properties
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload.keystore
          cat > android/key.properties <<EOF
          storeFile=upload.keystore
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Provision verified Android core SDK
        uses: ./.github/actions/android-core

      - name: Build Android ABI release APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Audit owned core APK closure
        shell: bash
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86_64; do
            python3 tool/android_release_checks.py \
              --apk "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              --expected-abi "$abi" \
              --output "build/android-validation/release-apk-${abi}-audit"
          done

      - name: Rename APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "dist/android/Rillight-android-${abi}-${GITHUB_REF_NAME}.apk"
          done

      - name: Upload Android package
        uses: actions/upload-artifact@v6
        with:
          name: release-android
          compression-level: 0
          path: dist/android/Rillight-android-*-${{ github.ref_name }}.apk
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=()
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            notes=(--notes-file "docs/releases/${GITHUB_REF_NAME}.md")
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Rillight ${GITHUB_REF_NAME}" \
            --draft \
            "${notes[@]}" \
            --generate-notes

  verify-release:
    name: Verify and publish release
    needs: release
    # macOS runner: the DMG check below needs hdiutil and codesign.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Require all platform packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            | jq --arg tag "${GITHUB_REF_NAME}" '[.[] | select(.tag_name == $tag)] | first')"

          if [ -z "$release_json" ] || [ "$release_json" = "null" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} was not found"
            exit 1
          fi

          if [ "$(jq -r '.draft' <<< "$release_json")" != "true" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} was published before verification"
            exit 1
          fi

          assets="$(jq -r '.assets[].name' <<< "$release_json")"
          echo "$assets"

          grep -Fqx "Rillight-windows-x64-${GITHUB_REF_NAME}-setup.exe" <<< "$assets"
          grep -Fqx "Rillight-linux-x64-${GITHUB_REF_NAME}.deb" <<< "$assets"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            grep -Fqx "Rillight-android-${abi}-${GITHUB_REF_NAME}.apk" <<< "$assets"
          done
          grep -Fqx "SHA256SUMS" <<< "$assets"
          grep -Eq "^Rillight-macos-.*-signed\.dmg$" <<< "$assets"

          echo "RELEASE_ID=$(jq -r '.id' <<< "$release_json")" >> "$GITHUB_ENV"

      - name: Set up Android build-tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools build-tools;36.0.0

      - name: Verify Android APK is not debug-signed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk_dir="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Rillight-android-*-${GITHUB_REF_NAME}.apk" \
            --dir "$apk_dir" \
            --clobber

          apksigner_bin="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$apksigner_bin" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi

          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="${apk_dir}/Rillight-android-${abi}-${GITHUB_REF_NAME}.apk"
            certs="$("$apksigner_bin" verify --print-certs "$apk")"
            echo "$certs"
            if grep -qi "Android Debug" <<< "$certs"; then
              echo "::error::${apk} is signed with the Android debug certificate"
              exit 1
            fi
          done

      - name: Verify macOS DMG carries the fixed self signature
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg_dir="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Rillight-macos-*-signed.dmg" \
            --dir "$dmg_dir" \
            --clobber
          dmg="$(find "$dmg_dir" -name 'Rillight-macos-*-signed.dmg' -type f | sort | head -n 1)"
          if [ -z "$dmg" ]; then
            echo "::error::Rillight-macos-${GITHUB_REF_NAME}-*-signed.dmg was not found in the release"
            exit 1
          fi

          mount_point="$(mktemp -d)/Rillight"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg" > /dev/null
          cleanup() { hdiutil detach "$mount_point" -force > /dev/null 2>&1 || true; }
          trap cleanup EXIT

          signature="$(codesign -dvv "$mount_point/Rillight.app" 2>&1 || true)"
          echo "$signature"
          if ! grep -Fq "Authority=Rillight Self Sign" <<< "$signature"; then
            echo "::error::Rillight-macos-${GITHUB_REF_NAME} does not carry the fixed self signature"
            exit 1
          fi

      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false
          echo "Published release ${GITHUB_REF_NAME} (id=${RELEASE_ID})"
