name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Verify pinned Windows core SDK
        shell: pwsh
        env:
          CORE_SDK_URL: ${{ vars.WINDOWS_CORE_SDK_URL }}
          CORE_SDK_SHA256: ${{ vars.WINDOWS_CORE_SDK_SHA256 }}
        run: |
          if (-not $env:CORE_SDK_URL -or -not $env:CORE_SDK_SHA256) {
            throw 'Set WINDOWS_CORE_SDK_URL and WINDOWS_CORE_SDK_SHA256 before a release tag.'
          }
          $archive = Join-Path $env:RUNNER_TEMP 'rillight-windows-core-sdk.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'rillight-windows-core-sdk'
          Invoke-WebRequest -Uri $env:CORE_SDK_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:CORE_SDK_SHA256.ToLowerInvariant()) {
            throw "Windows core SDK archive SHA256 mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $markers = @(Get-ChildItem -LiteralPath $extract -Filter 'rillight-core-dependencies.json' -File -Recurse)
          if ($markers.Count -ne 1) { throw "Expected one pinned SDK marker, found $($markers.Count)" }
          $prefix = $markers[0].DirectoryName
          python packages/rillight_player/native/verify_core_dependencies.py --prefix "$prefix" --target windows-x64 --require-subtitles
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows core SDK verification failed' }
          "RILLIGHT_CORE_PREFIX_WINDOWS_X64=$prefix" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Audit Windows release bundle
        run: python tool/verify_player_dependencies.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $output = Join-Path $env:GITHUB_WORKSPACE "dist\windows"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$version" "/O$output" "windows\installer\rillight.iss"

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: dist/windows/Rillight-windows-x64-${{ github.ref_name }}-setup.exe
          if-no-files-found: error

  macos:
    uses: ./.github/workflows/macos-package.yml
    with:
      version: ${{ github.ref_name }}
      signing: identity
      core_sdk_url: ${{ vars.MACOS_CORE_SDK_URL }}
      core_sdk_sha256: ${{ vars.MACOS_CORE_SDK_SHA256 }}
      core_dylib_url: ${{ vars.MACOS_CORE_DYLIB_URL }}
      core_dylib_sha256: ${{ vars.MACOS_CORE_DYLIB_SHA256 }}
    secrets: inherit

  linux:
    uses: ./.github/workflows/linux-package.yml
    with:
      version: ${{ github.ref_name }}

  android:
    name: Build Android
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The deprecated tools package is no longer published, so the action default fails.
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Check Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "${ANDROID_STORE_PASSWORD:-}" ] || missing+=(ANDROID_STORE_PASSWORD)
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Android signing secrets: ${missing[*]}. Configure them in repository Settings > Secrets and variables > Actions before tagging a release."
            exit 1
          fi

      - name: Decode keystore and write key.properties
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload.keystore
          cat > android/key.properties <<EOF
          storeFile=upload.keystore
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build pinned FFmpeg and libass for all Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install 'ndk;28.2.13676358' 'build-tools;36.0.0'
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
          python3 -m pip install meson==1.9.1 ninja==1.13.0
          prefix="$RUNNER_TEMP/rillight-android-sdk"
          work="$RUNNER_TEMP/rillight-android-sdk-work"
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          python3 packages/rillight_player/native/build_android_core_dependencies.py \
            --prefix-root "$prefix" --work "$work" --ndk "$ndk"
          python3 packages/rillight_player/native/build_android_libass.py \
            --prefix-root "$prefix" --work "$work" --ndk "$ndk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            python3 packages/rillight_player/native/verify_core_dependencies.py \
              --prefix "$prefix/$abi" --target "android-$abi" --require-subtitles
          done
          echo "RILLIGHT_CORE_SDK_ROOT=$prefix" >> "$GITHUB_ENV"

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Audit owned core APK closure
        run: python3 tool/android_release_checks.py --apk build/app/outputs/flutter-apk/app-release.apk --output build/android-validation/release-apk-audit

      - name: Rename APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/android/Rillight-android-${GITHUB_REF_NAME}.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@v6
        with:
          name: release-android
          path: dist/android/Rillight-android-${{ github.ref_name }}.apk
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Rillight ${GITHUB_REF_NAME}" \
            --draft \
            --generate-notes

  verify-release:
    name: Verify and publish release
    needs: release
    # macOS runner: the DMG check below needs hdiutil and codesign.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Require all platform packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            | jq --arg tag "${GITHUB_REF_NAME}" '[.[] | select(.tag_name == $tag)] | first')"

          if [ -z "$release_json" ] || [ "$release_json" = "null" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} was not found"
            exit 1
          fi

          if [ "$(jq -r '.draft' <<< "$release_json")" != "true" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} was published before verification"
            exit 1
          fi

          assets="$(jq -r '.assets[].name' <<< "$release_json")"
          echo "$assets"

          grep -Fqx "Rillight-windows-x64-${GITHUB_REF_NAME}-setup.exe" <<< "$assets"
          grep -Fqx "Rillight-linux-x64-${GITHUB_REF_NAME}.deb" <<< "$assets"
          grep -Fqx "Rillight-android-${GITHUB_REF_NAME}.apk" <<< "$assets"
          grep -Fqx "SHA256SUMS" <<< "$assets"
          grep -Eq "^Rillight-macos-.*-signed\.dmg$" <<< "$assets"

          echo "RELEASE_ID=$(jq -r '.id' <<< "$release_json")" >> "$GITHUB_ENV"

      - name: Set up Android build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0

      - name: Verify Android APK is not debug-signed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk_dir="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Rillight-android-${GITHUB_REF_NAME}.apk" \
            --dir "$apk_dir" \
            --clobber

          apk="${apk_dir}/Rillight-android-${GITHUB_REF_NAME}.apk"
          apksigner_bin="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$apksigner_bin" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi

          certs="$("$apksigner_bin" verify --print-certs "$apk")"
          echo "$certs"
          if grep -qi "Android Debug" <<< "$certs"; then
            echo "::error::Rillight-android-${GITHUB_REF_NAME}.apk is signed with the Android debug certificate"
            exit 1
          fi

      - name: Verify macOS DMG carries the fixed self signature
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg_dir="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Rillight-macos-*-signed.dmg" \
            --dir "$dmg_dir" \
            --clobber
          dmg="$(find "$dmg_dir" -name 'Rillight-macos-*-signed.dmg' -type f | sort | head -n 1)"
          if [ -z "$dmg" ]; then
            echo "::error::Rillight-macos-${GITHUB_REF_NAME}-*-signed.dmg was not found in the release"
            exit 1
          fi

          mount_point="$(mktemp -d)/Rillight"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg" > /dev/null
          cleanup() { hdiutil detach "$mount_point" -force > /dev/null 2>&1 || true; }
          trap cleanup EXIT

          signature="$(codesign -dv "$mount_point/rillight.app" 2>&1 || true)"
          echo "$signature"
          if ! grep -q "Rillight Self Sign" <<< "$signature"; then
            echo "::error::Rillight-macos-${GITHUB_REF_NAME} does not carry the fixed self signature"
            exit 1
          fi

      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false
          echo "Published release ${GITHUB_REF_NAME} (id=${RELEASE_ID})"
