name: rillight_player
description: Rillight's owned FFmpeg playback core for desktop and Android.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.rillight.player
        pluginClass: RillightCorePlayerPlugin
      windows:
        pluginClass: RillightPlayerPluginCApi
      macos:
        pluginClass: RillightPlayerPlugin
      linux:
        pluginClass: RillightPlayerPlugin
