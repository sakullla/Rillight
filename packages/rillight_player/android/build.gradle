group = 'com.rillight.player'
version = '1.0'
apply plugin: 'com.android.library'

def coreSdkRoot = providers.gradleProperty('rillightCoreSdkRoot')
    .orElse(providers.environmentVariable('RILLIGHT_CORE_SDK_ROOT')).orNull ?: ''
def supportedCoreAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
def coreAbis = providers.gradleProperty('rillightCoreAbis')
    .orElse(supportedCoreAbis.join(',')).get().split(',').collect { it.trim() }.findAll { it }
if (!coreAbis || coreAbis.toSet().size() != coreAbis.size ||
        !supportedCoreAbis.containsAll(coreAbis)) {
    throw new GradleException("rillightCoreAbis must select unique values from ${supportedCoreAbis.join(',')}")
}

android {
    namespace = 'com.rillight.player'
    compileSdk = 36
    defaultConfig {
        minSdk = 24
        ndk { abiFilters.addAll(coreAbis) }
        externalNativeBuild {
            cmake { arguments "-DRILLIGHT_CORE_SDK_ROOT=${coreSdkRoot}" }
        }
    }
    externalNativeBuild {
        cmake { path 'CMakeLists.txt' }
    }
    sourceSets {
        main.jniLibs.srcDirs += [layout.buildDirectory.dir('generated/coreJni').get().asFile]
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
dependencies {
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
}

// The pinned per-ABI SDK contains FFmpeg/libass runtime libraries. Keep them
// under build/ so a missing SDK never silently falls back to system codecs.
def stageCoreJni = tasks.register('stageCoreJniLibs') {
    doLast {
        if (!coreSdkRoot) throw new GradleException('Set rillightCoreSdkRoot or RILLIGHT_CORE_SDK_ROOT')
        coreAbis.each { abi ->
            def source = file("${coreSdkRoot}/${abi}/lib")
            if (!source.isDirectory()) throw new GradleException("Missing verified core SDK: ${source}")
            copy {
                from source
                include '*.so'
                into layout.buildDirectory.dir("generated/coreJni/${abi}").get().asFile
            }
        }
    }
}
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('JniLibFolders')) dependsOn(stageCoreJni)
}
